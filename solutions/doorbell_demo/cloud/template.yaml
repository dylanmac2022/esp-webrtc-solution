AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Doorbell Lab 7 cloud backend

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        EVENT_ID_TABLE: !Ref EventIdTable
        MEDIA_BUCKET: !Ref MediaBucket

Parameters:
  CorsAllowOrigin:
    Type: String
    Default: "*"
  DeviceApiKey:
    Type: String
    NoEcho: true
  MediaTransitionDays:
    Type: Number
    Default: 30
  MediaExpireDays:
    Type: Number
    Default: 90
  LivekitWsUrl:
    Type: String
  LivekitApiKey:
    Type: String
  LivekitApiSecret:
    Type: String
    NoEcho: true
  IotDataEndpoint:
    Type: String
  IotTopicPrefix:
    Type: String
    Default: doorbell

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionMediaToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: !Ref MediaTransitionDays
          - Id: ExpireNonImportantMedia
            Status: Enabled
            Filter:
              Tag:
                Key: important
                Value: "false"
            ExpirationInDays: !Ref MediaExpireDays

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: doorbell_events
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: eventTs
          AttributeType: N
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: eventTs
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: sessionId-index
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: eventTs
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: eventType-index
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: eventTs
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: eventId-index
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: eventTs
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EventIdTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: doorbell_event_ids
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowHeaders:
          - authorization
          - content-type
          - x-api-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  CommonFunctionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-common-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:Query
            Resource: !GetAtt EventsTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !Sub '${EventsTable.Arn}/index/*'
          - Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt EventsTable.Arn
              - !GetAtt EventIdTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt EventIdTable.Arn
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub '${MediaBucket.Arn}/*'

  LivekitTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/livekitToken.handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DEVICE_API_KEY: !Ref DeviceApiKey
          LIVEKIT_WS_URL: !Ref LivekitWsUrl
          LIVEKIT_API_KEY: !Ref LivekitApiKey
          LIVEKIT_API_SECRET: !Ref LivekitApiSecret
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /token/livekit
            Method: POST

  MediaUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/mediaUploadUrl.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref CommonFunctionPolicy
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DEVICE_API_KEY: !Ref DeviceApiKey
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /media/upload-url
            Method: POST

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/createEvent.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref CommonFunctionPolicy
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DEVICE_API_KEY: !Ref DeviceApiKey
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: POST

  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/listEvents.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref CommonFunctionPolicy
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DEVICE_API_KEY: !Ref DeviceApiKey
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: GET

  GetPlaybackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/getPlayback.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref CommonFunctionPolicy
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DEVICE_API_KEY: !Ref DeviceApiKey
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events/{eventId}/playback
            Method: GET

  PublishCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/publishCommand.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - iot:Publish
              Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/${IotTopicPrefix}/*'
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DEVICE_API_KEY: !Ref DeviceApiKey
          IOT_DATA_ENDPOINT: !Ref IotDataEndpoint
          IOT_TOPIC_PREFIX: !Ref IotTopicPrefix
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /device/command
            Method: POST

Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  BucketName:
    Value: !Ref MediaBucket
  EventsTableName:
    Value: !Ref EventsTable
  EventIdTableName:
    Value: !Ref EventIdTable
